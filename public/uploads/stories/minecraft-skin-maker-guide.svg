<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#112a29"/><path d="M0 820H1600V900H0Z" fill="#294934"/><g font-family="Arial,sans-serif" fill="#eff6ed"><text x="72" y="92" font-size="24" font-weight="700" letter-spacing="3" fill="#bce996">ACESERVER / SKIN MAKER</text><text x="72" y="205" font-size="65" font-weight="700">Make your Minecraft skin</text><text x="72" y="272" font-size="29" fill="#b9cec4">Describe a new look. Check it in 3D. Save the PNG.</text><rect x="72" y="335" width="344" height="280" rx="20" fill="#1b3433" stroke="#426b5c" stroke-width="2"/><rect x="98" y="364" width="50" height="50" fill="#aee38c"/><text x="123" y="398" text-anchor="middle" fill="#152d29" font-size="22" font-weight="700">01</text><text x="98" y="474" font-size="29" font-weight="700" fill="#bce996">CHOOSE</text><text x="98" y="530" font-size="23" fill="#edf5ec">Classic 4px / Slim 3px</text><rect x="441" y="335" width="344" height="280" rx="20" fill="#1b3433" stroke="#426b5c" stroke-width="2"/><rect x="467" y="364" width="50" height="50" fill="#aee38c"/><text x="492" y="398" text-anchor="middle" fill="#152d29" font-size="22" font-weight="700">02</text><text x="467" y="474" font-size="29" font-weight="700" fill="#bce996">DESCRIBE</text><text x="467" y="530" font-size="23" fill="#edf5ec">Text + optional image</text><rect x="810" y="335" width="344" height="280" rx="20" fill="#1b3433" stroke="#426b5c" stroke-width="2"/><rect x="836" y="364" width="50" height="50" fill="#aee38c"/><text x="861" y="398" text-anchor="middle" fill="#152d29" font-size="22" font-weight="700">03</text><text x="836" y="474" font-size="29" font-weight="700" fill="#bce996">REVIEW</text><text x="836" y="530" font-size="23" fill="#edf5ec">Rotate the 3D view</text><rect x="1179" y="335" width="344" height="280" rx="20" fill="#1b3433" stroke="#426b5c" stroke-width="2"/><rect x="1205" y="364" width="50" height="50" fill="#aee38c"/><text x="1230" y="398" text-anchor="middle" fill="#152d29" font-size="22" font-weight="700">04</text><text x="1205" y="474" font-size="29" font-weight="700" fill="#bce996">SAVE</text><text x="1205" y="530" font-size="23" fill="#edf5ec">64 × 64 PNG</text><text x="72" y="707" font-size="28">Choose the same arm type when importing in your game.</text><text x="72" y="767" font-size="24" fill="#b9cec4">Consent before sending • Save before closing • Device support varies</text><text x="1520" y="861" text-anchor="end" font-size="20" fill="#b9cec4">Workflow illustration — not generated skin output</text></g></svg>