name: Bootstrap MCSkinGPT

on:
  push:
    branches:
      - feat/mcskin-gpt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Materialize implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .mcskin-bundle.b64 > /tmp/mcskin-files.tar.gz
          tar --extract --gzip --file /tmp/mcskin-files.tar.gz
          rm .mcskin-bundle.b64

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: MCSkinGPTを追加"
          git push origin HEAD:feat/mcskin-gpt
