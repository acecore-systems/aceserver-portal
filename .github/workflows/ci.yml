name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate CMS content
        run: npm run validate:content

      - name: Test content validation
        run: npm run test:content

      - name: Test YouTube Atom snapshot
        run: npm run test:youtube-atom

      - name: Test i18n
        run: npm run test:i18n

      - name: Test translation merge automation
        run: npm run test:translation-merge

      - name: Test Alpha chat API
        run: npm run test:alpha

      - name: Test portal Vectorize corpus
        run: npm run test:portal-vectorize

      - name: Test site search API
        run: npm run test:search

      - name: Test skin maker
        run: npm run test:skin-maker

      - name: Type-check skin maker client
        run: npm run typecheck:skin-maker

      - name: Test CMS proxy
        run: npm run test:cms

      - name: Check isolated CMS token issuer
        run: |
          npx wrangler types cloudflare/cms-token-issuer/worker-configuration.d.ts --config cloudflare/cms-token-issuer/wrangler.jsonc --env-interface TokenIssuerEnv --include-runtime false --check
          npx tsc -p cloudflare/cms-token-issuer/tsconfig.json
          npx wrangler deploy --config cloudflare/cms-token-issuer/wrangler.jsonc --dry-run

      - name: Check Pages Function bindings
        run: npm run types:functions:check

      - name: Type-check Pages Functions
        run: npm run typecheck:functions

      - name: Check Dynmap Worker bindings
        run: npm run types:dynmap:check

      - name: Type-check Dynmap Worker
        run: npm run typecheck:dynmap

      - name: Test Dynmap Worker
        run: npm run test:dynmap

      - name: Build site
        run: npm run build
