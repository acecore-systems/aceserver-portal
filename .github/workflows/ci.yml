name: Bootstrap MCSkinGPT

on:
  push:
    branches:
      - feat/mcskin-gpt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check bundle readiness
        id: bundle
        shell: bash
        run: |
          if [[ -f .mcskin-ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize implementation
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .mcskin-part-* | base64 --decode > /tmp/mcskin-files.tar.gz
          gzip --test /tmp/mcskin-files.tar.gz
          tar --extract --gzip --file /tmp/mcskin-files.tar.gz
          rm -f .mcskin-bundle.b64 .mcskin-part-* .mcskin-ready

      - name: Commit implementation
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: MCSkinGPTを追加"
          git push origin HEAD:feat/mcskin-gpt
