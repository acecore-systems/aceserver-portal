name: CMS Content PR

on:
  push:
    branches:
      - cms-content

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out CMS branch
        uses: actions/checkout@v4
        with:
          ref: cms-content
          fetch-depth: 0

      - name: Create pull request for CMS changes
        env:
          GH_TOKEN: ${{ secrets.CMS_PR_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: main
          HEAD_BRANCH: cms-content
        run: |
          set -euo pipefail

          owner="${REPO%%/*}"
          git fetch origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

          changed_files="$(git diff --name-only "origin/$BASE_BRANCH...HEAD")"

          if [ -z "$changed_files" ]; then
            echo "No CMS changes to publish."
            exit 0
          fi

          disallowed_files="$(printf '%s\n' "$changed_files" | grep -Ev '^(src/content/|public/uploads/)' || true)"

          if [ -n "$disallowed_files" ]; then
            echo "::error::cms-content contains files outside allowed CMS content paths."
            printf '%s\n' "$disallowed_files"
            exit 1
          fi

          existing_pr="$(
            gh pr list \
              --repo "$REPO" \
              --head "$owner:$HEAD_BRANCH" \
              --base "$BASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // ""'
          )"

          if [ -n "$existing_pr" ]; then
            echo "CMS pull request already exists: #$existing_pr"
            exit 0
          fi

          body_file="${RUNNER_TEMP}/cms-content-pr.md"
          cat > "$body_file" <<'BODY'
          ## 関連 Issue

          なし

          ## 概要

          Sveltia CMS から `cms-content` ブランチに保存された content-only 編集内容を `main` に反映します。

          ## 主な変更点

          - CMS で保存されたページ文言、サイト設定、告知、アップロード画像など
          - 変更ファイルは `src/content/**` と `public/uploads/**` に限定されています

          ## 確認したこと

          - `cms-content` と `main` の差分が CMS content/upload path のみであること

          ## 未確認事項・補足

          - PR CI で `npm run format:check`、`npm run validate:content`、`npm run build` を確認してください。
          - レビュー後、通常の merge commit または rebase merge でマージしてください。squash merge は `cms-content` 同期が安全に fast-forward できなくなるため避けてください。
          BODY

          gh pr create \
            --repo "$REPO" \
            --base "$BASE_BRANCH" \
            --head "$owner:$HEAD_BRANCH" \
            --title "CMS編集内容を反映" \
            --body-file "$body_file"
