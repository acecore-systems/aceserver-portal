name: Merge Translation PR

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate manually
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: portal-translation-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve translation pull requests
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            numbers="${{ inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            numbers="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[] | select(.head.ref | startswith("copilot/")) | .number')"
          else
            numbers="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
            if [ -z "$numbers" ]; then
              numbers="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty' || true)"
            fi
          fi
          {
            echo 'numbers<<EOF'
            echo "$numbers"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check out current main
        if: steps.pr.outputs.numbers != ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create Translation Bot token
        id: app-token
        if: steps.pr.outputs.numbers != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRANSLATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TRANSLATION_BOT_APP_PRIVATE_KEY }}

      - name: Set up Node.js
        if: steps.pr.outputs.numbers != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.numbers != ''
        run: npm ci

      - name: Test translation merge automation
        if: steps.pr.outputs.numbers != ''
        run: npm run test:translation-merge

      - name: Validate translation automation secrets
        if: steps.pr.outputs.numbers != ''
        env:
          PORTAL_TRANSLATION_CONTRACT_SECRET: ${{ secrets.PORTAL_TRANSLATION_CONTRACT_SECRET }}
        run: node -e "if (Buffer.byteLength(process.env.PORTAL_TRANSLATION_CONTRACT_SECRET ?? '', 'utf8') < 32) throw new Error('PORTAL_TRANSLATION_CONTRACT_SECRET must be at least 32 bytes.')"

      - name: Merge eligible translation PR
        if: steps.pr.outputs.numbers != ''
        env:
          GITHUB_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PORTAL_TRANSLATION_CONTRACT_SECRET: ${{ secrets.PORTAL_TRANSLATION_CONTRACT_SECRET }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
        run: |
          for pr_number in $PR_NUMBERS; do
            node scripts/merge-translation-pr.mjs --pr="$pr_number"
          done
