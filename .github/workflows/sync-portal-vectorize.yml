name: Sync portal Vectorize index

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 同期先のVectorize index
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  sync-preview:
    name: Sync preview index from protected main
    if: >-
      vars.ACESERVER_PORTAL_VECTORIZE_SYNC_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-portal-search-preview
    concurrency:
      group: vectorize-portal-search-preview
      cancel-in-progress: false

    steps:
      - name: Check out protected main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build protected main corpus
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Sync preview Vectorize index
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PORTAL_SEARCH_PREVIEW_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTORIZE_INDEX_NAME: aceserver-portal-search-openai-1536-preview
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_PORTAL_SEARCH_PREVIEW_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is not configured."
            exit 1
          fi
          npm run sync:portal-vectorize

  sync-production:
    name: Reconcile production index with the public portal
    if: >-
      vars.ACESERVER_PORTAL_VECTORIZE_SYNC_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.target == 'production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-portal-search-production
    concurrency:
      group: vectorize-portal-search-production
      cancel-in-progress: false

    steps:
      - name: Check out protected main tooling
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Wait for the pushed commit to be public
        if: github.event_name == 'push'
        working-directory: tooling
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node scripts/wait-for-portal-deployment.mjs
          https://asv.acecore.net/.well-known/aceserver-portal-build.json
          "$EXPECTED_COMMIT"

      - name: Resolve deployed site commit
        id: site
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          protected_main_commit="$(git -C tooling rev-parse HEAD)"

          if [[ "$EVENT_NAME" == "push" ]]; then
            site_commit="$PUSH_COMMIT"
          else
            site_commit="$(
              node tooling/scripts/wait-for-portal-deployment.mjs \
                https://asv.acecore.net/.well-known/aceserver-portal-build.json \
                --print-current
            )"
          fi
          site_commit="${site_commit,,}"

          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Published marker does not contain a full Git SHA."
            exit 1
          fi
          if ! git -C tooling cat-file -e "${site_commit}^{commit}"; then
            echo "::error::Published commit does not exist in this repository."
            exit 1
          fi
          if ! git -C tooling merge-base --is-ancestor \
            "$site_commit" "$protected_main_commit"; then
            echo "::error::Published commit is not an ancestor of protected main."
            exit 1
          fi

          echo "commit=$site_commit" >> "$GITHUB_OUTPUT"

      - name: Check out deployed site source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: tooling/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deployed site dependencies
        working-directory: site
        run: npm ci

      - name: Build deployed site corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
        run: npm run build

      - name: Confirm the built commit is still public
        env:
          BUILT_COMMIT: ${{ steps.site.outputs.commit }}
        run: >-
          node tooling/scripts/wait-for-portal-deployment.mjs
          https://asv.acecore.net/.well-known/aceserver-portal-build.json
          --assert-current
          "$BUILT_COMMIT"
          site/dist/vector-corpus.json

      - name: Sync production Vectorize index
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PORTAL_SEARCH_PRODUCTION_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTORIZE_INDEX_NAME: aceserver-portal-search-openai-1536-production
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_PORTAL_SEARCH_PRODUCTION_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is not configured."
            exit 1
          fi
          node tooling/scripts/sync-portal-vectorize.mjs \
            --corpus site/dist/vector-corpus.json
