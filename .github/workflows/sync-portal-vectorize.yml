name: Sync portal Vectorize index

on:
  check_run:
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_reconcile:
        description: Force full reconciliation, including unchanged content
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  sync-production:
    name: Reconcile production index with the public portal
    if: >-
      vars.ACESERVER_PORTAL_VECTORIZE_SYNC_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'check_run' &&
          github.event.check_run.name == 'Cloudflare Pages' &&
          github.event.check_run.app.id == 85455 &&
          github.event.check_run.conclusion == 'success') ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-portal-search-production
    concurrency:
      group: vectorize-portal-search-production
      cancel-in-progress: false

    steps:
      - name: Check out protected main tooling
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Resolve public deployment and previous verified receipt
        id: site
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RECONCILE: ${{ inputs.force_reconcile && 'true' || 'false' }}
        run: node scripts/portal-sync-receipt.mjs prepare

      - name: Check out deployed site source
        if: steps.site.outputs.sync == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false

      - name: Set up Node.js
        if: steps.site.outputs.sync == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: tooling/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deployed site dependencies
        if: steps.site.outputs.sync == 'true'
        working-directory: site
        run: npm ci

      - name: Build deployed site corpus
        if: steps.site.outputs.sync == 'true'
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
        run: npm run build

      - name: Confirm the built commit is still public
        if: steps.site.outputs.sync == 'true'
        env:
          BUILT_COMMIT: ${{ steps.site.outputs.commit }}
        run: >-
          node tooling/scripts/wait-for-portal-deployment.mjs
          https://asv.acecore.net/.well-known/aceserver-portal-build.json
          --assert-current
          "$BUILT_COMMIT"
          site/dist/vector-corpus.json

      - name: Sync production Vectorize index
        if: steps.site.outputs.sync == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PORTAL_SEARCH_PRODUCTION_API_TOKEN }}
          VECTORIZE_INDEX_NAME: aceserver-portal-search-bge-m3-1024-production-v1
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_PORTAL_SEARCH_PRODUCTION_API_TOKEN is not configured."
            exit 1
          fi
          args=(
            --corpus site/dist/vector-corpus.json
            --confirm-production "$VECTORIZE_INDEX_NAME"
          )
          node tooling/scripts/sync-portal-vectorize.mjs \
            "${args[@]}"

      - name: Record successful reconciliation or unchanged receipt
        if: steps.site.outputs.eligible == 'true'
        working-directory: tooling
        run: node scripts/portal-sync-receipt.mjs record

      - name: Save receipt for the next main run
        if: steps.site.outputs.eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portal-vectorize-receipt
          path: tooling/.portal-sync-state/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
