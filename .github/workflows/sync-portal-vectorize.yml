name: Sync portal Vectorize index

on:
  check_run:
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_reconcile:
        description: Force full reconciliation, including unchanged content
        type: boolean
        default: true
      approved_plan_target:
        description: Target index for the reviewed plan hash
        type: choice
        default: bge
        options: [bge, voyage]
      approved_plan_sha256:
        description: Reviewed exact index and corpus plan hash (leave empty for normal guarded sync)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  sync-production:
    name: Reconcile production index with the public portal
    if: >-
      vars.ACESERVER_PORTAL_VECTORIZE_SYNC_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'check_run' &&
          github.event.check_run.name == 'Cloudflare Pages' &&
          github.event.check_run.app.id == 85455 &&
          github.event.check_run.conclusion == 'success') ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    env:
      PORTAL_SYNC_PROFILE: ${{ vars.PORTAL_VOYAGE_SYNC_ENABLED == 'true' && (vars.PORTAL_BGE_SYNC_ENABLED == 'false' && 'voyage' || 'both') || (vars.PORTAL_BGE_SYNC_ENABLED == 'false' && 'disabled' || 'bge') }}
      PORTAL_RECEIPT_NAME: ${{ vars.PORTAL_VOYAGE_SYNC_ENABLED == 'true' && (vars.PORTAL_BGE_SYNC_ENABLED == 'false' && 'portal-vectorize-receipt-voyage' || 'portal-vectorize-receipt-both') || 'portal-vectorize-receipt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-portal-search-production
    concurrency:
      group: vectorize-portal-search-production
      cancel-in-progress: false

    steps:
      - name: Check out protected main tooling
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Resolve public deployment and previous verified receipt
        id: site
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RECONCILE: ${{ inputs.force_reconcile && 'true' || 'false' }}
        run: node scripts/portal-sync-receipt.mjs prepare

      - name: Check out deployed site source
        if: steps.site.outputs.sync == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false

      - name: Set up Node.js
        if: steps.site.outputs.sync == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: tooling/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deployed site dependencies
        if: steps.site.outputs.sync == 'true'
        working-directory: site
        run: npm ci

      - name: Build deployed site corpus
        if: steps.site.outputs.sync == 'true'
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
        run: npm run build

      - name: Confirm the built commit is still public
        if: steps.site.outputs.sync == 'true'
        env:
          BUILT_COMMIT: ${{ steps.site.outputs.commit }}
        run: >-
          node tooling/scripts/wait-for-portal-deployment.mjs
          https://asv.acecore.net/.well-known/aceserver-portal-build.json
          --assert-current
          "$BUILT_COMMIT"
          site/dist/vector-corpus.json

      - name: Sync production Vectorize index
        if: steps.site.outputs.sync == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PORTAL_SEARCH_PRODUCTION_API_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          APPROVED_PLAN_TARGET: ${{ inputs.approved_plan_target || 'bge' }}
          APPROVED_PLAN_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_plan_sha256 || '' }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_PORTAL_SEARCH_PRODUCTION_API_TOKEN is not configured."
            exit 1
          fi
          set -euo pipefail
          if [[ -n "$APPROVED_PLAN_SHA256" ]] &&
             [[ "$PORTAL_SYNC_PROFILE" != "both" && "$PORTAL_SYNC_PROFILE" != "$APPROVED_PLAN_TARGET" ]]; then
            echo "::error::The approved plan target is not enabled."
            exit 1
          fi
          sync_index() {
            local provider="$1" index="$2"
            local args=(--corpus site/dist/vector-corpus.json --confirm-production "$index")
            if [[ -n "$APPROVED_PLAN_SHA256" && "$APPROVED_PLAN_TARGET" == "$provider" ]]; then
              args+=(--approved-plan-sha256 "$APPROVED_PLAN_SHA256")
            fi
            VECTORIZE_INDEX_NAME="$index" node tooling/scripts/sync-portal-vectorize.mjs "${args[@]}"
          }
          if [[ "$PORTAL_SYNC_PROFILE" == "bge" || "$PORTAL_SYNC_PROFILE" == "both" ]]; then
            sync_index bge aceserver-portal-search-bge-m3-1024-production-v1
          fi
          if [[ "$PORTAL_SYNC_PROFILE" == "voyage" || "$PORTAL_SYNC_PROFILE" == "both" ]]; then
            if [[ -z "${VOYAGE_API_KEY:-}" ]]; then
              echo "::error::VOYAGE_API_KEY is not configured."
              exit 1
            fi
            node tooling/scripts/wait-for-portal-deployment.mjs \
              https://asv.acecore.net/.well-known/aceserver-portal-build.json \
              --assert-current "${{ steps.site.outputs.commit }}" site/dist/vector-corpus.json
            sync_index voyage aceserver-portal-search-voyage-4-lite-1024-production-v1
          fi

      - name: Record successful reconciliation or unchanged receipt
        if: steps.site.outputs.eligible == 'true'
        working-directory: tooling
        run: node scripts/portal-sync-receipt.mjs record

      - name: Save receipt for the next main run
        if: steps.site.outputs.eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PORTAL_RECEIPT_NAME }}
          path: tooling/.portal-sync-state/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
